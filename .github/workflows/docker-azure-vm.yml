
name: Docker Build, Push and Deploy to Azure VM

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: digifrontend.azurecr.io
  IMAGE_NAME: digifrontend/webapp-test
  IMAGE_TAG: ${{ github.sha }}

jobs:

  Build_docker_container:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Azure Login
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: >-
           { "clientId": "${{ secrets.AZURE_CLIENT_ID }}","clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId": "${{ secrets.AZURE_TENANT_ID }}" }

      # Step 3: Login to Azure Container Registry
      - name: ACR Login
        run: |
          az acr login --name digifrontend

      # Step 4: Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG \
            .

      # Step 5: Push Docker Image to ACR
      - name: Push Docker Image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG


  Deploy_container_into_VM:
    name: Deploy Container into Azure VM
    runs-on: ubuntu-latest
    needs: Build_docker_container

    steps:

      # Step 1: Connect to Azure VM using SSH
      - name: Login into VM and Deploy Container
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22

          envs: ACR_LOGIN_SERVER,IMAGE_NAME,IMAGE_TAG,ACR_USERNAME,ACR_PASSWORD

          script: |
            set -e

            echo "=================================="
            echo "Starting VM Deployment"
            echo "=================================="

            # Install Docker if not installed
            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."

              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              rm get-docker.sh

              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            # Login to Azure Container Registry
            echo "$ACR_PASSWORD" | sudo docker login \
              "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" \
              --password-stdin

            # Pull the new Docker image
            echo "Pulling Docker image..."

            sudo docker pull \
              "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

            # Stop and remove old container if it exists
            echo "Removing old container..."

            sudo docker rm -f webapp_http || true

            # Run the new container
            echo "Starting new container..."

            sudo docker run -d \
              --name webapp_http \
              --restart unless-stopped \
              -p 80:80 \
              "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

            # Verify deployment
            echo "Checking container status..."

            sudo docker ps --filter name=webapp_http

            echo "=================================="
            echo "Deployment Completed Successfully"
            echo "=================================="

